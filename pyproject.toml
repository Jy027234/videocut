[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-editing-toolkit"
version = "0.1.0"
description = "Independent worker toolkit for agent-assisted video editing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
]

[project.scripts]
video-toolkit-demo = "video_editing_toolkit.demo:main"
video-toolkit-agentctl = "video_editing_toolkit.agentctl:main"
video-toolkit-agentctl-live-smoke = "video_editing_toolkit.agentctl_live_smoke:main"
video-toolkit-agentctl-remote = "video_editing_toolkit.agentctl_remote:main"
video-toolkit-agentctl-worker = "video_editing_toolkit.agentctl_worker:main"
video-toolkit-local-api = "video_editing_toolkit.local_api:main"
video-toolkit-platform-core = "video_editing_toolkit.platform_core:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.22",
]
api = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
]
analysis = [
  "click!=8.3.0,~=8.0",
  "numpy>=2",
  "opencv-python-headless>=4.9",
  "platformdirs",
  "tqdm",
]
speech = [
  "platformdirs",
]
tts = [
  "onnxruntime>=1.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
