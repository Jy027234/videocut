services:
  toolkit:
    build:
      context: .
    image: video-editing-toolkit:dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - video-toolkit-data:/workspace/.video-toolkit-data
    environment:
      VIDEO_TOOLKIT_DATA_DIR: /workspace/.video-toolkit-data
    command: pytest

  # Optional profile boundary for future heavier analysis workers.
  # Keep PySceneDetect, OpenCV, Whisper, model downloads, and GPU/runtime-specific
  # dependencies out of the default toolkit image until their contracts settle.
  analysis:
    profiles:
      - analysis
    build:
      context: .
      target: analysis
    image: video-editing-toolkit:analysis
    working_dir: /workspace
    volumes:
      - .:/workspace
      - video-toolkit-data:/workspace/.video-toolkit-data
    environment:
      VIDEO_TOOLKIT_DATA_DIR: /workspace/.video-toolkit-data
      VIDEO_TOOLKIT_WORKER_PROFILE: analysis
    command:
      - python
      - -c
      - import cv2; import scenedetect; print('analysis profile ready')

  # Optional speech/Whisper boundary. This service is intentionally only a
  # lightweight runtime shell today: Whisper/Torch and model weights stay out of
  # the default and analysis images until the deployment contract is explicit.
  speech:
    profiles:
      - speech
    build:
      context: .
      target: speech
    image: video-editing-toolkit:speech
    working_dir: /workspace
    volumes:
      - .:/workspace
      - video-toolkit-data:/workspace/.video-toolkit-data
      - whisper-cache:/workspace/.video-toolkit-data/whisper-cache
    environment:
      VIDEO_TOOLKIT_DATA_DIR: /workspace/.video-toolkit-data
      VIDEO_TOOLKIT_WORKER_PROFILE: speech
      WHISPER_CACHE_DIR: /workspace/.video-toolkit-data/whisper-cache
      VET_WHISPER_MODEL_DIR: /workspace/.video-toolkit-data/whisper-cache
    command:
      - python
      - -c
      - import os; print('speech profile ready; install Whisper/Torch explicitly when needed; cache:', os.environ.get('WHISPER_CACHE_DIR'))

volumes:
  video-toolkit-data:
    name: video-toolkit-data
  whisper-cache:
    name: video-toolkit-whisper-cache
